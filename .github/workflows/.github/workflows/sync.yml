name: auto-sync-products
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: run sync
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
        run: python sync.py --once
      - name: publish
        run: |
          git config user.name "sync-bot"
          git config user.email "bot@users.noreply.github.com"
          git add products.js sync.log 2>/dev/null || git add products.js
          git diff --cached --quiet || git commit -m "sync: new products"
          git push
